post:
  summary: Invite Users to a Share
  description: Send an email containing a link to the share to one or more recipients.
  operationId: shareInvite
  tags:
    - Shares
  requestBody:
    content:
      application/json:
        schema:
          type: object
          required: [share, emails]
          properties:
            share:
              type: string
              format: uuid
              description: Unique identifier of the share to invite to.
            emails:
              type: array
              items:
                type: string
                format: email
              description: Email addresses to send the share link to.
  responses:
    '200':
      description: Successful request
    '401':
      $ref: '../../openapi.yaml#/components/responses/UnauthorizedError'
    '403':
      $ref: '../../openapi.yaml#/components/responses/ForbiddenError'
