get:
  summary: List Shares
  description: List the shares.
  operationId: getShares
  parameters:
    - $ref: '../../openapi.yaml#/components/parameters/Fields'
    - $ref: '../../openapi.yaml#/components/parameters/Limit'
    - $ref: '../../openapi.yaml#/components/parameters/Offset'
    - $ref: '../../openapi.yaml#/components/parameters/Page'
    - $ref: '../../openapi.yaml#/components/parameters/Sort'
    - $ref: '../../openapi.yaml#/components/parameters/Filter'
    - $ref: '../../openapi.yaml#/components/parameters/Search'
    # TODO(directus/directus#27938): uncomment once the reusable parameters land
    # - $ref: '../../openapi.yaml#/components/parameters/Aggregate'
    # - $ref: '../../openapi.yaml#/components/parameters/GroupBy'
    # - $ref: '../../openapi.yaml#/components/parameters/Deep'
    # - $ref: '../../openapi.yaml#/components/parameters/Alias'
    # - $ref: '../../openapi.yaml#/components/parameters/Export'
    # - $ref: '../../openapi.yaml#/components/parameters/Backlink'
    - $ref: '../../openapi.yaml#/components/parameters/Meta'
  responses:
    '200':
      description: Successful request
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '../../openapi.yaml#/components/schemas/Shares'
              meta:
                $ref: '../../openapi.yaml#/components/schemas/x-metadata'
    '401':
      $ref: '../../openapi.yaml#/components/responses/UnauthorizedError'
  tags:
    - Shares

post:
  summary: Create a Share
  description: Create a new share.
  operationId: createShare
  parameters:
    - $ref: '../../openapi.yaml#/components/parameters/Fields'
  requestBody:
    content:
      application/json:
        schema:
          anyOf:
            - $ref: '../../openapi.yaml#/components/schemas/Shares'
  responses:
    '200':
      description: Successful request
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '../../openapi.yaml#/components/schemas/Shares'
    '401':
      $ref: '../../openapi.yaml#/components/responses/UnauthorizedError'
  tags:
    - Shares

patch:
  summary: Update Multiple Shares
  description: Update multiple shares at the same time.
  operationId: updateShares
  parameters:
    - $ref: '../../openapi.yaml#/components/parameters/Fields'
    - $ref: '../../openapi.yaml#/components/parameters/Limit'
    - $ref: '../../openapi.yaml#/components/parameters/Offset'
    - $ref: '../../openapi.yaml#/components/parameters/Sort'
    - $ref: '../../openapi.yaml#/components/parameters/Filter'
    - $ref: '../../openapi.yaml#/components/parameters/Search'
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            keys:
              type: array
              items:
                type: string
            data:
              anyOf:
                - $ref: '../../openapi.yaml#/components/schemas/Shares'
  responses:
    '200':
      description: Successful request
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '../../openapi.yaml#/components/schemas/Shares'
    '401':
      $ref: '../../openapi.yaml#/components/responses/UnauthorizedError'
  tags:
    - Shares

delete:
  summary: Delete Multiple Shares
  description: Delete multiple existing shares.
  operationId: deleteShares
  responses:
    '200':
      description: Successful request
    '401':
      $ref: '../../openapi.yaml#/components/responses/UnauthorizedError'
  tags:
    - Shares
